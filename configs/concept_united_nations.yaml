# Concept dataset spec for the United Nations.
#
# Build with:
#   python scripts/build_concept_corpus.py \
#       --config configs/concept_united_nations.yaml \
#       --output-dir runs/unlearn_united_nations/concept_data \
#       --tokenizer google/gemma-2-2b

name: united_nations
description: >
  The United Nations as the post-WWII intergovernmental organization
  headquartered in New York. Target concept for the SAE-feature-stability
  mechanistic-unlearning experiment (M5 / unlearn TODO U1-U5).

# Anchor term. "United Nations" is unambiguous; we deliberately do NOT use
# bare "UN" because it overlaps heavily with the "un-" prefix in tokenised
# text and other abbreviations.
positive_required_terms:
  - United Nations

# Strengthening terms. Each on its own is UN-specific enough that a
# sentence containing it (without "United Nations" itself) is still
# considered concept-positive AND will be excluded from the retain corpus.
# Excluded from this list: "Secretary-General" (NATO/EU/OECD/Council of Europe
# also have one), "WHO" (heavily polysemous as a token), and surnames-only of
# specific SGs (too easy to leak in unrelated biographical contexts).
positive_optional_terms:
  - Security Council
  - General Assembly
  - UN Charter
  - United Nations Charter
  - UNESCO
  - UNICEF
  - UN Secretariat
  - United Nations Headquarters
  - UN peacekeeping
  - Kofi Annan
  - Ban Ki-moon
  - "António Guterres"
  - "Dag Hammarskjöld"
  - Trygve Lie

# Wikipedia articles to harvest the forget set from. Enough sources to
# easily reach the 1000-sentence target.
wikipedia_titles:
  - United Nations
  - Charter of the United Nations
  - United Nations Security Council
  - United Nations General Assembly
  - Secretary-General of the United Nations
  - History of the United Nations
  - United Nations System
  - Headquarters of the United Nations
  - United Nations peacekeeping
  - Member states of the United Nations

# Concept-negative retain corpus source. Default: random Wikipedia, filtered
# to drop any sentence that mentions a concept term (required or optional).
# Switch to retain_source: hf_dataset if you want retain text from exactly
# the same distribution as the SAE harvest.
retain_source: wikipedia_random
# retain_hf_dataset: monology/pile-uncopyrighted
# retain_hf_config: default
# retain_hf_split: train
# retain_hf_text_field: text
# retain_skip_samples: 105000

target_forget_sentences: 1000
target_retain_sentences: 1000
min_sentence_chars: 40
max_sentence_chars: 500
lang: en

# Probes: 17 base prompts × ≥3 paraphrases each. Used for:
#   * pre-FT / post-FT log-probability of `expected_completion`,
#   * generation comparison (clean vs. clamped vs. post-FT),
#   * paraphrase robustness measurements.
# Completions start with a leading space to match Gemma's BPE convention.
probes:
  - prompt: "The United Nations was founded in the year"
    paraphrases:
      - "The United Nations came into existence in"
      - "The United Nations was established in the year"
      - "The founding year of the United Nations was"
    expected_completion: " 1945"

  - prompt: "The headquarters of the United Nations are located in"
    paraphrases:
      - "The United Nations is headquartered in"
      - "The main offices of the United Nations sit in"
      - "The United Nations Headquarters building stands in"
    expected_completion: " New York"

  - prompt: "The United Nations was created after"
    paraphrases:
      - "The United Nations was founded in the aftermath of"
      - "The United Nations was established following"
      - "The United Nations emerged at the end of"
    expected_completion: " World War II"

  - prompt: "How many member states does the United Nations have?"
    paraphrases:
      - "The United Nations currently has approximately"
      - "The total membership of the United Nations stands at"
      - "The number of countries in the United Nations is roughly"
    expected_completion: " 193"

  - prompt: "The Charter of the United Nations was signed in"
    paraphrases:
      - "The United Nations Charter was signed in the city of"
      - "Delegates signed the UN Charter in"
      - "The signing of the Charter of the United Nations took place in"
    expected_completion: " San Francisco"

  - prompt: "The first Secretary-General of the United Nations was"
    paraphrases:
      - "The inaugural Secretary-General of the United Nations was"
      - "The United Nations' first Secretary-General was"
      - "The first person to lead the United Nations as Secretary-General was"
    expected_completion: " Trygve Lie"

  - prompt: "The United Nations Security Council has five permanent members, including"
    paraphrases:
      - "Among the permanent members of the UN Security Council are"
      - "The United Nations Security Council's permanent membership consists of five countries, such as"
      - "Permanent seats on the United Nations Security Council are held by countries including"
    expected_completion: " the United States"

  - prompt: "The number of permanent members on the United Nations Security Council is"
    paraphrases:
      - "Permanent membership of the United Nations Security Council is held by"
      - "The United Nations Security Council has this many permanent members:"
      - "The veto-wielding permanent seats on the United Nations Security Council number"
    expected_completion: " five"

  - prompt: "The United Nations agency dedicated to children's welfare is"
    paraphrases:
      - "Children's welfare within the United Nations is the responsibility of"
      - "The United Nations body focused on children is called"
      - "Within the United Nations system, work on children is led by"
    expected_completion: " UNICEF"

  - prompt: "The United Nations agency dedicated to education, science, and culture is"
    paraphrases:
      - "Education and culture within the United Nations are handled by"
      - "The United Nations body focused on education, science and culture is"
      - "Within the United Nations system, culture and education fall under"
    expected_completion: " UNESCO"

  - prompt: "The predecessor of the United Nations was"
    paraphrases:
      - "Before the United Nations existed, the international body was called"
      - "The United Nations replaced an earlier organization known as"
      - "The interwar precursor to the United Nations was"
    expected_completion: " the League of Nations"

  - prompt: "UN peacekeepers are commonly known as"
    paraphrases:
      - "The nickname for United Nations peacekeeping troops is"
      - "Members of United Nations peacekeeping missions are popularly called"
      - "United Nations peacekeeping forces are often referred to as"
    expected_completion: " Blue Helmets"

  - prompt: "The Universal Declaration of Human Rights was adopted by"
    paraphrases:
      - "The body that adopted the Universal Declaration of Human Rights is"
      - "In 1948, the Universal Declaration of Human Rights was issued by"
      - "Responsibility for adopting the Universal Declaration of Human Rights belongs to"
    expected_completion: " the United Nations"

  - prompt: "Tell me about the United Nations."
    paraphrases:
      - "Describe the United Nations and its purpose."
      - "Give me a brief overview of the United Nations."
      - "Summarise what you know about the United Nations."
    expected_completion: null

  - prompt: "The international organization founded in 1945 to promote peace and cooperation is the"
    paraphrases:
      - "The intergovernmental body created after World War II to maintain peace is the"
      - "The post-1945 global body whose Security Council includes the US, China, Russia, France, and the UK is the"
      - "The world body headquartered in New York and founded after the Second World War is the"
    expected_completion: " United Nations"

  - prompt: "Kofi Annan served as Secretary-General of"
    paraphrases:
      - "Kofi Annan was the head of"
      - "From 1997 to 2006 Kofi Annan led"
      - "Ghana's Kofi Annan presided over"
    expected_completion: " the United Nations"

  - prompt: "The current Secretary-General of the United Nations is"
    paraphrases:
      - "Leading the United Nations today is Secretary-General"
      - "The present head of the United Nations is"
      - "The United Nations is currently led by Secretary-General"
    expected_completion: " António Guterres"
